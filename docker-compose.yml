services:
  db:
    image: postgres:16-alpine
    container_name: smartcampus360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus360_docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartcampus360_docker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartcampus_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartcampus360_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@db:5432/${POSTGRES_DB:-smartcampus360_docker}
      SECRET_KEY: ${SECRET_KEY:-docker_dev_secret_key_change_in_production_32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - smartcampus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: smartcampus360_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartcampus_network

volumes:
  postgres_data:
    name: smartcampus360_postgres_data
  uploads_data:
    name: smartcampus360_uploads_data

networks:
  smartcampus_network:
    name: smartcampus360_network
    driver: bridge
